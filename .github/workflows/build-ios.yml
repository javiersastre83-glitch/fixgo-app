name: Build iOS (TestFlight)

# Se lanza SOLO a mano: pestaña "Actions" → "Build iOS (TestFlight)" → "Run workflow".
# Así los cambios de Android no disparan builds de iPhone (y al revés).
# Compila en una Mac de GitHub, firma con la cuenta de Apple Developer y sube el build a TestFlight.
#
# Secretos que tiene que cargar Javier (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID              → Team ID de la cuenta (developer.apple.com → Membership details)
#   APPSTORE_KEY_ID            → Key ID de la clave de API de App Store Connect
#   APPSTORE_ISSUER_ID         → Issuer ID (misma pantalla de claves de API)
#   APPSTORE_API_KEY           → el contenido completo del archivo AuthKey_XXXX.p8 (abrirlo con el Bloc de notas y copiar todo)
on:
  workflow_dispatch:
    inputs:
      subir_a_testflight:
        description: "Subir a TestFlight (requiere la cuenta de Apple activa y los 4 secretos). Si está destildado, solo prueba que compila."
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Elegir la versión de Xcode más nueva instalada
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Compilar la app web (Vite)
        run: npm run build

      - name: Sincronizar el proyecto iOS con Capacitor
        run: npx cap sync ios

      - name: Prueba de compilación (sin firmar, para simulador)
        if: ${{ !inputs.subir_a_testflight }}
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
          echo "✅ La versión iPhone compila bien."

      - name: Preparar la clave de API de App Store Connect
        if: ${{ inputs.subir_a_testflight }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$APPSTORE_API_KEY" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          grep -q "BEGIN PRIVATE KEY" ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 || (echo "❌ El secreto APPSTORE_API_KEY no parece un archivo .p8 completo" && exit 1)
        env:
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}

      # Paso 1: se compila el archive SIN firmar (así no hace falta tener iPhones registrados).
      # Paso 2 (siguiente): al exportar, Xcode lo firma para el App Store con la
      # "firma en la nube" de Apple usando la clave de API (crea solo el certificado y el perfil).
      - name: Compilar (archive, sin firmar todavía)
        if: ${{ inputs.subir_a_testflight }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fixgo.xcarchive" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # El archive sin firmar no lleva los permisos especiales de la app ("Continuar con Apple").
      # Acá se los pegamos con una firma provisoria; la firma real de Apple (paso siguiente)
      # los lee de ahí y los conserva.
      - name: Pegar los permisos de la app al archive
        if: ${{ inputs.subir_a_testflight }}
        run: |
          APP="$RUNNER_TEMP/Fixgo.xcarchive/Products/Applications/App.app"
          codesign --force --deep --sign - --timestamp=none \
            --entitlements ios/App/App/App.entitlements "$APP"
          echo "Permisos pegados al archive:"
          codesign -d --entitlements - "$APP" 2>/dev/null || true

      - name: Exportar el .ipa para App Store Connect
        if: ${{ inputs.subir_a_testflight }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Fixgo.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}
          ls -la "$RUNNER_TEMP/export"

      # Si el .ipa final no trae el permiso, se frena ACÁ (antes de subir) para no mandar
      # a TestFlight una versión donde "Continuar con Apple" no funcione.
      - name: Verificar que el .ipa conserva "Continuar con Apple"
        if: ${{ inputs.subir_a_testflight }}
        run: |
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$RUNNER_TEMP/export/App.ipa" -d "$RUNNER_TEMP/ipa"
          codesign -d --entitlements - "$RUNNER_TEMP/ipa/Payload/App.app" > "$RUNNER_TEMP/permisos.txt" 2>/dev/null || true
          echo "Permisos del .ipa final:"
          cat "$RUNNER_TEMP/permisos.txt"
          if grep -q "com.apple.developer.applesignin" "$RUNNER_TEMP/permisos.txt"; then
            echo "✅ El .ipa incluye el permiso de Continuar con Apple."
          else
            echo "❌ El .ipa NO incluye el permiso de Continuar con Apple. No se sube a TestFlight."
            exit 1
          fi

      - name: Subir a TestFlight
        if: ${{ inputs.subir_a_testflight }}
        run: |
          xcrun altool --upload-app -t ios \
            -f "$RUNNER_TEMP/export/App.ipa" \
            --apiKey ${{ secrets.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: Guardar el .ipa como descarga del workflow (por las dudas)
        if: ${{ inputs.subir_a_testflight }}
        uses: actions/upload-artifact@v4
        with:
          name: fixgo-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7

      - name: Borrar la clave de API del entorno
        if: always()
        run: rm -rf ~/private_keys
